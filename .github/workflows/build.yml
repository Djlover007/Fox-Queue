name: Build Fox Queue

# Jeder Push auf main baut die Version 1.0.<Laufnummer> und veröffentlicht sie
# im öffentlichen Repo Djlover007/Fox-Queue-Downloads. Die Apps holen sich dort ihre Updates.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  DOWNLOADS_REPO: Djlover007/Fox-Queue-Downloads

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK bauen
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: gradle assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=${{ env.APP_VERSION }}
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk FoxQueue.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FoxQueue-Android
          path: FoxQueue.apk

  windows:
    name: Windows-EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm version ${{ env.APP_VERSION }} --no-git-tag-version --allow-same-version
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FoxQueue-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  release:
    name: Update veröffentlichen
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Token prüfen
        env:
          T: ${{ secrets.DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::Secret DOWNLOADS_TOKEN fehlt – siehe README, Abschnitt Auto-Update."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.DOWNLOADS_REPO }}
          token: ${{ secrets.DOWNLOADS_TOKEN }}
          tag_name: v${{ env.APP_VERSION }}
          name: Fox Queue ${{ env.APP_VERSION }}
          body: |
            Fox Queue ${{ env.APP_VERSION }}
            - Android: FoxQueue.apk
            - Windows: FoxQueue-Setup-${{ env.APP_VERSION }}.exe (mit Auto-Update) oder Portable-EXE
          make_latest: true
          files: |
            out/FoxQueue-Android/FoxQueue.apk
            out/FoxQueue-Windows/*.exe
            out/FoxQueue-Windows/*.blockmap
            out/FoxQueue-Windows/latest.yml
