name: Build Fox Queue

# Jeder Push auf main testet, baut die Version 1.0.<Laufnummer> und veröffentlicht sie
# im öffentlichen Repo Djlover007/Fox-Queue-Downloads. Die Apps holen sich dort ihre Updates.
# Zweige dev/... werden nur getestet und gebaut, nicht veröffentlicht.

on:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  DOWNLOADS_REPO: Djlover007/Fox-Queue-Downloads

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test

  android:
    name: Android-APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      # Signierschlüssel aus den Secrets (KEYSTORE_B64 + KEYSTORE_PASSWORD), sobald sie angelegt sind.
      # Bis dahin wird die Datei android/app/foxqueue.keystore aus dem Repo benutzt.
      - name: Signierschlüssel aus Secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fox.keystore"
            # Muss derselbe Schlüssel sein wie bisher, sonst lassen sich Updates nicht installieren
            echo "11f4a66b75e6ee4e48aa10eb467ce3f302695bf40b8ab726002e41f9330f4c19  $RUNNER_TEMP/fox.keystore" | sha256sum -c -
            echo "KEYSTORE_FILE=$RUNNER_TEMP/fox.keystore" >> "$GITHUB_ENV"
          fi
      - name: APK bauen
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=${{ env.APP_VERSION }}
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk FoxQueue.apk
      - uses: actions/upload-artifact@v7
        with:
          name: FoxQueue-Android
          path: FoxQueue.apk

  windows:
    name: Windows-EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm version ${{ env.APP_VERSION }} --no-git-tag-version --allow-same-version
      - run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: FoxQueue-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  release:
    name: Update veröffentlichen
    needs: [tests, android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Token prüfen
        if: github.ref == 'refs/heads/main'
        env:
          T: ${{ secrets.DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::Secret DOWNLOADS_TOKEN fehlt – siehe README, Abschnitt Auto-Update."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: out
      - name: Dateien prüfen
        run: |
          ls -R out
          test -f out/FoxQueue-Android/FoxQueue.apk
          ls out/FoxQueue-Windows/*.exe out/FoxQueue-Windows/latest.yml
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          repository: ${{ env.DOWNLOADS_REPO }}
          token: ${{ secrets.DOWNLOADS_TOKEN }}
          tag_name: v${{ env.APP_VERSION }}
          name: Fox Queue ${{ env.APP_VERSION }}
          body: |
            Fox Queue ${{ env.APP_VERSION }}
            - Android: FoxQueue.apk
            - Windows: FoxQueue-Setup-${{ env.APP_VERSION }}.exe (mit Auto-Update) oder Portable-EXE
          make_latest: true
          files: |
            out/FoxQueue-Android/FoxQueue.apk
            out/FoxQueue-Windows/*.exe
            out/FoxQueue-Windows/*.blockmap
            out/FoxQueue-Windows/latest.yml
